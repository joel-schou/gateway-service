spring.application.name=gateway-service
server.port=${SERVER_PORT:9003}
app.product-service-url=${PRODUCT_SERVICE_URL:http://localhost:8080}
app.auth-server-url=${AUTH_SERVER_URL:http://localhost:9000}
app.order-service-url=${ORDER_SERVICE_URL:http://localhost:7500}
app.payment-service-url=${PAYMENT_SERVICE_URL:http://localhost:8085}

app.cookie.secure=${COOKIE_SECURE:true}
app.cookie.same-site=${COOKIE_SAME_SITE:None}

